server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proxy_pass here contains the URI /api/, so nginx replaces the matching
    # location URI (/api/) with that same /api/ — net effect: the prefix is
    # preserved. Two other forms behave differently: `proxy_pass
    # http://backend:8000;` (no URI at all) also preserves the original
    # request URI unchanged; but `proxy_pass http://backend:8000/;` (URI is
    # just the root `/`) would replace /api/ with /, stripping the prefix and
    # breaking every route.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No React Router — kept only as a safe static fallback for a
    # single-screen SPA, not because multiple client routes exist.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
